name: Update arXiv Daily Reader

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8-13 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-arxiv-daily-reader
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check update script
        run: node --check scripts/update_arxiv.mjs

      - name: Fetch today's arXiv pages
        run: node scripts/update_arxiv.mjs

      - name: Commit archive update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.js
          if git diff --cached --quiet; then
            echo "No arXiv archive changes to commit."
          else
            git commit -m "Update arXiv daily reader"
            git push
          fi
