name: Update arXiv Daily Reader

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"

permissions:
  contents: write

concurrency:
  group: update-arxiv-daily-reader
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Decide whether to run
        id: schedule
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour="$(TZ=Europe/London date +%H)"
          if [ "$hour" != "09" ]; then
            echo "Not 09:00 in Europe/London; skipping this UTC trigger."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: steps.schedule.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.schedule.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch today's arXiv pages
        if: steps.schedule.outputs.should_run == 'true'
        run: node scripts/update_arxiv.mjs

      - name: Commit archive update
        if: steps.schedule.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.js
          if git diff --cached --quiet; then
            echo "No arXiv archive changes to commit."
          else
            git commit -m "Update arXiv daily reader"
            git push
          fi
